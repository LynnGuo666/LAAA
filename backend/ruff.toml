target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions", ".venv", "migrate_add_groups.py"]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line too long
  "E402",   # module level import not at top (允许延迟导入,FastAPI 常见模式)
  "E711",   # comparison to None (SQLAlchemy == None 是合法查询)
  "E712",   # true/false comparison (SQLAlchemy == True/False 合法)
  "B008",   # function call in argument defaults (FastAPI Depends)
  "B904",   # raise without from (现有代码风格,逐步迁移)
  "B017",   # pytest.raises(Exception)
  "SIM102", # collapsible if (现有逻辑,合并会改变 device_token 缺失语义)
  "SIM103", # needless bool (可读性,显式 if/return)
  "SIM115", # context manager for open (密钥加载/生成场景,函数级 open 可接受)
  "SIM105", # suppressible exception (contextlib.suppress)
  "SIM108", # if-else -> ternary (可读性)
  "SIM117", # nested with
  "F841",   # unused variable (access_expires 等留作记录)
  "RUF002", # ambiguous unicode in docstring (中文 docstring)
  "RUF003", # ambiguous unicode in comment (中文注释)
  "RUF006", # asyncio dangling task (后台任务模式)
  "RUF010", # explicit f-string type conversion
  "RUF059", # unused unpacked variable
  "UP007",  # non-pep604 union (Optional[X] 风格)
  "UP006",  # non-pep585 annotation (List[X] 风格)
  "UP011",  # lru_cache without parameters
  "UP017",  # datetime.timezone.utc
  "UP035",  # deprecated import (declarative_base 等逐步迁)
  "UP042",  # replace str enum
  "UP045",  # non-pep604 Optional
  "C414",   # unnecessary double cast
  "RUF001", # ambiguous unicode in string (中文)
]

[lint.per-file-ignores]
"tests/*" = ["B017"]
"alembic/*" = ["E", "F401", "I001"]

