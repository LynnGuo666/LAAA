name: Quality Gate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_call: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --- Backend: lint + test + security scan ---
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff bandit pip-audit

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Pytest
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-for-pytest-only-32chars-min!!
          DATABASE_URL: sqlite:///./test_oauth.db
          ENABLE_LOGIN_ANOMALY_DETECTION: "false"
          BLOCK_SUSPICIOUS_LOGIN: "false"
          SMTP_ENABLED: "false"
        run: pytest tests/ -v

      # bandit/pip-audit 暂不阻断 CI(`|| true`),这是**有意为之**而非疏忽:
      # - bandit:现有代码有若干低置信度告警(如 assert 用法),清理后再改为阻断
      # - pip-audit:依赖链里存在若干上游尚未发修复版的 CVE(尤其 transitive
      #   依赖),需要先建豁免清单(pip-audit --ignore)再收紧
      # TODO: 建立供应链 CVE 豁免清单后,去掉两处 `|| true` 让它们 gate 合并。
      - name: Bandit security scan
        working-directory: backend
        run: bandit -r app -ll || true

      - name: pip-audit (dependency CVEs)
        working-directory: backend
        run: pip-audit -r requirements.lock || true

      # --- Frontend: lint + typecheck + build ---
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint app/ lib/ components/

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # 静态导出构建也纳入 CI:next build 的失败(类型/页面级错误)在这里
      # 暴露,而不是等到 docker build 阶段才炸(那时定位成本高得多)。
      # 产物不需要上传,只为验证可构建。
      - name: Build frontend (static export)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
