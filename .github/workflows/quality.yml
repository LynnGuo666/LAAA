name: Quality Gate

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_call: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # --- Backend: lint + test + security scan ---
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff bandit pip-audit

      - name: Ruff lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Pytest
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-for-pytest-only-32chars-min!!
          DATABASE_URL: sqlite:///./test_oauth.db
          ENABLE_LOGIN_ANOMALY_DETECTION: "false"
          BLOCK_SUSPICIOUS_LOGIN: "false"
          SMTP_ENABLED: "false"
        run: pytest tests/ -v

      - name: Bandit security scan
        working-directory: backend
        run: bandit -r app -ll || true

      - name: pip-audit (dependency CVEs)
        working-directory: backend
        run: pip-audit -r requirements.lock || true

      # --- Frontend: lint + typecheck ---
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint app/ lib/ components/

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
